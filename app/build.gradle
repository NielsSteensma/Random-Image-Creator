plugins {
    id 'com.android.application'
    id "com.google.firebase.crashlytics"
}

apply plugin: 'kotlin-parcelize'

def isCIBuild = System.getenv("CI") == "true"

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.randomimagecreator"
        namespace = "com.randomimagecreator"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 17
        versionName "17"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    if (isCIBuild) {
        signingConfigs.release.storeFile = file("../keystore.jks")
        signingConfigs.release.storePassword = System.getenv("KEYSTORE_PASSWORD")
        signingConfigs.release.keyAlias = System.getenv("KEYSTORE_ALIAS")
        signingConfigs.release.keyPassword = System.getenv("KEYSTORE_ALIAS_PASSWORD")

        apply plugin: 'com.google.gms.google-services'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

if (isCIBuild) {
    play {
        serviceAccountCredentials.set(file("google-services.json"))
    }
}

dependencies {
    implementation project(":algorithms")
    implementation platform('com.google.firebase:firebase-bom:34.12.0')
    implementation 'com.google.firebase:firebase-analytics-ktx:22.5.0'
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    testImplementation 'junit:junit:4.13.2'
    testImplementation("io.mockk:mockk:1.14.9")
    testImplementation "org.mockito:mockito-core:5.23.0"
    testImplementation "org.mockito.kotlin:mockito-kotlin:6.3.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2"
    androidTestImplementation 'androidx.test:core-ktx:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}
